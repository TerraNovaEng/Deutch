<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsch Dialoge (A1-A2)</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
            color: var(--primary);
        }
        header {
            background: var(--primary);
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        #dialogue-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .dialogue-card {
            background: var(--card-bg);
            padding: 1.25rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-left: 4px solid var(--accent);
        }
        .dialogue-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .dialogue-card h3 { margin: 0 0 0.5rem 0; font-size: 1.1rem; }
        .dialogue-card p { margin: 0; color: #666; font-size: 0.9rem; }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }
        .option-btn {
            background: white;
            border: 2px solid var(--primary);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }
        .option-btn:hover { background: #e2e8f0; }
        .option-btn.correct { background: #27ae60; color: white; border-color: #27ae60; }
        .option-btn.wrong { background: #c0392b; color: white; border-color: #c0392b; }
        #feedback {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
        }
        #feedback.success { background: #d4edda; color: #155724; }
        #feedback.error { background: #f8d7da; color: #721c24; }
        .hidden { display: none; }
        #back-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>🇩🇪 Deutsch Dialoge</h1>
        <div id="score-board">Punkte: <span id="score">0</span></div>
    </header>

    <main>
        <section id="menu-screen" class="screen active">
            <h2>Wähle ein Modul (A1 - A2)</h2>
            <div id="dialogue-list"></div>
        </section>

        <section id="exercise-screen" class="screen">
            <button id="back-btn">← Zurück</button>
            <h3 id="dialogue-title"></h3>
            <div id="game-container">
                <div id="prompt-area"></div>
                <div id="options-area" class="options-grid"></div>
            </div>
            <div id="feedback" class="hidden"></div>
        </section>
    </main>

    <script>
        const dialoguesData = [
            {
                id: 1,
                title: "Modul 1: Begrüßung & Kennenlernen (A1)",
                type: "choice",
                steps: [
                    { prompt: "Person A: Guten Tag! Ich heiße Markus. Wie ist dein Name?", options: ["Hallo, ich heiße Sarah.", "Auf Wiedersehen.", "Mir geht es gut."], correct: 0 },
                    { prompt: "Person B: Freut mich, Markus! Woher kommst du ursprünglich?", options: ["Ich komme aus München.", "Guten Morgen.", "Tschüss!"], correct: 0 },
                    { prompt: "Person A: Und wie gefällt es dir hier in der neuen Stadt?", options: ["Es ist wunderschön und sehr lebendig.", "Ich heiße Sarah.", "Aus München."], correct: 0 },
                    { prompt: "Person B: Das finde ich auch. Wohnst du schon lange hier?", options: ["Erst seit zwei Monaten in einer kleinen Wohnung.", "Mir geht es super.", "Bis bald."], correct: 0 },
                    { prompt: "Person A: Achso, verstehe. Wir sehen uns bestimmt mal wieder!", options: ["Ja, bis bald!", "Hallo!", "Wie bitte?"], correct: 0 }
                ]
            },
            {
                id: 2,
                title: "Modul 2: Im Café bestellen & bezahlen (A1)",
                type: "choice",
                steps: [
                    { prompt: "Kellner: Guten Tag! Haben Sie schon gewählt?", options: ["Ja, ich hätte gerne einen großen Milchkaffee.", "Ich heiße Markus.", "Auf Wiedersehen."], correct: 0 },
                    { prompt: "Kellner: Gerne. Möchten Sie auch etwas Süßes dazu?", options: ["Ein Stück frischen Apfelkuchen bitte.", "Ich komme aus München.", "Mir geht es gut."], correct: 0 },
                    { prompt: "Kellner: Sehr gute Wahl. Sonst noch etwas?", options: ["Nein danke, das ist alles für den Moment.", "Ja, ich wohne in Berlin.", "Guten Tag."], correct: 0 },
                    { prompt: "Kellner: Kommt sofort. Zusammen oder getrennt bezahlen?", options: ["Zusammen bitte, ich zahle mit Karte.", "Hallo!", "Guten Tag."], correct: 0 }
                ]
            },
            {
                id: 3,
                title: "Modul 3: Nach dem Weg fragen (A2)",
                type: "choice",
                steps: [
                    { prompt: "Passant: Entschuldigung, wissen Sie, wo die nächste U-Bahn-Station ist?", options: ["Gehen Sie geradeaus und dann die zweite Straße links.", "Ich heiße Sarah.", "Mir geht es gut."], correct: 0 },
                    { prompt: "Passant: Ist das weit von hier zu Fuß?", options: ["Nein, höchstens fünf Minuten.", "Ja, ich komme aus München.", "Guten Tag."], correct: 0 },
                    { prompt: "Passant: Muss ich vorher noch eine große Hauptstraße überqueren?", options: ["Genau, direkt an der Ampel müssen Sie rüber.", "Auf Wiederhören.", "Nein danke."], correct: 0 },
                    { prompt: "Passant: Vielen Dank für Ihre nette und ausführliche Hilfe!", options: ["Gern geschehen, einen schönen Tag noch!", "Auf Wiederhören.", "Nein danke."], correct: 0 }
                ]
            },
            {
                id: 4,
                title: "Modul 4: Im Supermarkt nach Produkten fragen (A1)",
                type: "choice",
                steps: [
                    { prompt: "Kunde: Entschuldigung, wo finde ich frisches Gemüse?", options: ["Direkt am Eingang auf der linken Seite.", "Ich trinke gerne Wasser.", "Auf Wiedersehen."], correct: 0 },
                    { prompt: "Kunde: Und gibt es hier auch biologisch angebauten Tomaten?", options: ["Ja, im Gang drei neben den Gurken.", "Guten Morgen.", "Nein, danke."], correct: 0 },
                    { prompt: "Kunde: Wissen Sie zufällig auch, wo die Milchprodukte stehen?", options: ["Die Kühltheke befindet sich ganz hinten im Laden.", "Ich heiße Anna.", "Tschüss!"], correct: 0 },
                    { prompt: "Kunde: Perfekt, vielen Dank für die Auskunft.", options: ["Sehr gerne, schönen Tag noch!", "Tschüss!", "Wie bitte?"], correct: 0 }
                ]
            },
            {
                id: 5,
                title: "Modul 5: Über Hobbies und Freizeit sprechen (A2)",
                type: "choice",
                steps: [
                    { prompt: "Person A: Was machst du eigentlich am Wochenende am liebsten?", options: ["Ich gehe oft wandern und fotografiere die Natur.", "Ich komme aus Berlin.", "Mir geht es gut."], correct: 0 },
                    { prompt: "Person B: Das klingt spannend! Machst du das ganz alleine?", options: ["Meistens gehe ich mit Freunden oder meiner Familie.", "Nein, das ist ein Bahnhof.", "Tschüss!"], correct: 0 },
                    { prompt: "Person A: Welche Regionen besuchst du dabei meistens?", options: ["Oft fahren wir in die nahegelegenen Berge.", "Guten Tag.", "Zwei Kaffee bitte."], correct: 0 },
                    { prompt: "Person A: Da hätte ich nächstes Mal vielleicht Lust mitzukommen.", options: ["Sehr gerne, melde dich einfach bei mir!", "Guten Tag.", "Zwei Kaffee bitte."], correct: 0 }
                ]
            },
            {
                id: 6,
                title: "Modul 6: Termine beim Arzt vereinbaren (A2)",
                type: "choice",
                steps: [
                    { prompt: "Empfang: Praxis Dr. Schmidt, guten Tag.", options: ["Guten Tag, ich möchte gerne einen Termin vereinbaren.", "Ich heiße Anna.", "Ich suche den Bahnhof."], correct: 0 },
                    { prompt: "Empfang: Sind Sie bereits Patient bei uns in der Praxis?", options: ["Nein, ich komme zum ersten Mal zu Ihnen.", "Zwei Kaffee, bitte.", "In Gang 3."], correct: 0 },
                    { prompt: "Empfang: Haben Sie akute Beschwerden oder ist es ein Kontrolltermin?", options: ["Ich habe seit zwei Tagen starke Kopfschmerzen.", "Zwei Kaffee, bitte.", "In Gang 3."], correct: 0 },
                    { prompt: "Empfang: Kommen Sie am besten heute Nachmittag um 15 Uhr vorbei.", options: ["Gut, ich bin pünktlich da. Danke!", "Auf Wiedersehen.", "Tschüss."], correct: 0 }
                ]
            },
            {
                id: 7,
                title: "Modul 7: Dialog ordnen - Kennenlernen (A1/A2)",
                type: "order",
                sentences: [
                    "Hallo! Entschuldigung, ist dieser Platz noch frei?",
                    "Ja, natürlich, setzen Sie sich bitte.",
                    "Vielen Dank. Ich heiße Thomas, und Sie?",
                    "Ich bin Maria. Studieren Sie hier an der Universität?",
                    "Nein, ich arbeite schon seit zwei Jahren als Ingenieur."
                ]
            },
            {
                id: 8,
                title: "Modul 8: Im Bekleidungsgeschäft (A1)",
                type: "choice",
                steps: [
                    { prompt: "Verkäufer: Kann ich Ihnen behilflich sein?", options: ["Ja, ich suche eine warme Jacke für den Winter.", "Ich heiße Paul.", "Mir geht es gut."], correct: 0 },
                    { prompt: "Verkäufer: Welche Farbe hätten Sie denn gerne?", options: ["Am liebsten hätte ich Dunkelblau oder Schwarz.", "Aus den USA.", "Guten Tag."], correct: 0 },
                    { prompt: "Verkäufer: Welche Größe tragen Sie denn normal?", options: ["Normalerweise trage ich Größe L.", "Aus den USA.", "Guten Tag."], correct: 0 },
                    { prompt: "Verkäufer: Die Umkleidekabinen sind dort hinten rechts.", options: ["Vielen Dank, ich probiere sie gleich an.", "Tschüss.", "Nein danke."], correct: 0 }
                ]
            },
            {
                id: 9,
                title: "Modul 9: Pläne für den Urlaub schmieden (A2)",
                type: "choice",
                steps: [
                    { prompt: "Person A: Hast du schon Pläne für die Sommerferien?", options: ["Ja, ich möchte dieses Jahr nach Österreich reisen.", "Ich komme aus Albanien.", "Zwei Euro fünfzig."], correct: 0 },
                    { prompt: "Person B: Fährst du mit dem Zug oder nimmst du das Auto?", options: ["Wir nehmen den Zug, das ist umweltfreundlicher.", "Auf Wiedersehen.", "Gern geschehen."], correct: 0 },
                    { prompt: "Person A: Habt ihr schon ein Hotel oder eine Pension gebucht?", options: ["Ja, eine kleine Hütte in den Bergen.", "Ich heiße Anna.", "Tschüss."], correct: 0 },
                    { prompt: "Person A: Das stimmt absolut. Viel Spaß beim Packen!", options: ["Danke dir, wir sehen uns nach dem Urlaub!", "Hallo!", "Wie bitte?"], correct: 0 }
                ]
            },
            {
                id: 10,
                title: "Modul 10: Wichtiger Telefonanruf im Büro (A2)",
                type: "choice",
                steps: [
                    { prompt: "Anrufer: Guten Tag, mein Name ist Wagner. Spreche ich mit Herrn Bauer?", options: ["Guten Tag Herr Wagner, nein, er ist im Meeting.", "Ich heiße Anna.", "Mir geht es gut."], correct: 0 },
                    { prompt: "Anrufer: Wann kann ich ihn denn am besten erreichen?", options: ["Versuchen Sie es am besten morgen früh ab neun Uhr.", "Auf Wiederhören!", "Tschüss!"], correct: 0 },
                    { prompt: "Anrufer: Soll ich ihm eine kurze Nachricht hinterlassen?", options: ["Ja gerne,richten Sie ihm bitte aus, dass ich zurückgerufen habe.", "Auf Wiedersehen.", "Nein."], correct: 0 },
                    { prompt: "Anrufer: Alles klar, ich rufe morgen wieder an. Auf Wiederhören.", options: ["Wiederhören, schönen Tag noch!", "Danke.", "Hallo!"], correct: 0 }
                ]
            }
        ];

        let currentDialogue = null;
        let currentStepIndex = 0;
        let score = 0;

        const menuScreen = document.getElementById('menu-screen');
        const exerciseScreen = document.getElementById('exercise-screen');
        const dialogueList = document.getElementById('dialogue-list');
        const dialogueTitle = document.getElementById('dialogue-title');
        const promptArea = document.getElementById('prompt-area');
        const optionsArea = document.getElementById('options-area');
        const feedback = document.getElementById('feedback');
        const scoreDisplay = document.getElementById('score');

        function init() {
            renderMenuList();
            document.getElementById('back-btn').addEventListener('click', goHome);
        }

        function renderMenuList() {
            dialogueList.innerHTML = '';
            dialoguesData.forEach(dialogue => {
                const card = document.createElement('div');
                card.className = 'dialogue-card';
                if (dialogue.type === "order") {
                    card.innerHTML = `<h3>${dialogue.title}</h3><p>Ordnen-Modus</p>`;
                } else {
                    card.innerHTML = `<h3>${dialogue.title}</h3><p>${dialogue.steps.length} Schritte</p>`;
                }
                card.addEventListener('click', () => startDialogue(dialogue.id));
                dialogueList.appendChild(card);
            });
        }

        function startDialogue(id) {
            currentDialogue = dialoguesData.find(d => d.id === id);
            currentStepIndex = 0;
            menuScreen.classList.remove('active');
            exerciseScreen.classList.add('active');
            dialogueTitle.textContent = currentDialogue.title;
            
            if (currentDialogue.type === "order") {
                loadOrderExercise();
            } else {
                loadStep();
            }
        }

        function loadStep() {
            feedback.className = 'hidden';
            optionsArea.innerHTML = '';
            
            if (currentStepIndex >= currentDialogue.steps.length) {
                promptArea.innerHTML = `<h3>🎉 Bravo! Dialog abgeschlossen!</h3>`;
                return;
            }

            const step = currentDialogue.steps[currentStepIndex];
            promptArea.innerHTML = `<p><strong>${step.prompt}</strong></p>`;

            let shuffled = step.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            shuffled.sort(() => Math.random() - 0.5);

            shuffled.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = item.text;
                btn.addEventListener('click', () => checkAnswer(item.originalIndex === step.correct, btn));
                optionsArea.appendChild(btn);
            });
        }

        function checkAnswer(isCorrect, btn) {
            const buttons = optionsArea.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.add('correct');
                feedback.textContent = "Richtig! Gut gemacht.";
                feedback.className = "success";
                score += 10;
                scoreDisplay.textContent = score;
                currentStepIndex++;
                setTimeout(loadStep, 1500);
            } else {
                btn.classList.add('wrong');
                feedback.textContent = "Falsch. Versuch es noch einmal!";
                feedback.className = "error";
                setTimeout(() => {
                    buttons.forEach(b => b.disabled = false);
                    btn.classList.remove('wrong');
                    feedback.className = "hidden";
                }, 1500);
            }
        }

        function loadOrderExercise() {
            feedback.className = 'hidden';
            promptArea.innerHTML = `<p><strong>Bringe die Sätze in die richtige Reihenfolge (klicke nacheinander):</strong></p>`;
            optionsArea.innerHTML = '';

            const correctOrder = [...currentDialogue.sentences];
            let shuffledSentences = [...currentDialogue.sentences];
            shuffledSentences.sort(() => Math.random() - 0.5);

            let userSelection = [];

            const selectedContainer = document.createElement('div');
            selectedContainer.style.marginBottom = "1rem";
            selectedContainer.style.padding = "0.75rem";
            selectedContainer.style.background = "#fff";
            selectedContainer.style.borderRadius = "6px";
            selectedContainer.style.border = "1px dashed #2c3e50";
            selectedContainer.innerHTML = "<strong>Deine Reihenfolge:</strong> <span id='selected-list' style='color:#666;'>Noch nichts ausgewählt</span>";
            optionsArea.appendChild(selectedContainer);

            const poolContainer = document.createElement('div');
            poolContainer.className = "options-grid";
            optionsArea.appendChild(poolContainer);

            shuffledSentences.forEach(sentence => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = sentence;
                btn.addEventListener('click', () => {
                    userSelection.push(sentence);
                    btn.style.display = 'none';
                    
                    const listSpan = document.getElementById('selected-list');
                    listSpan.innerHTML = "<br>• " + userSelection.join("<br>• ");

                    if (userSelection.length === correctOrder.length) {
                        let isMatch = userSelection.every((val, idx) => val === correctOrder[idx]);
                        if (isMatch) {
                            feedback.textContent = "🎉 Richtig! Perfekte Reihenfolge.";
                            feedback.className = "success";
                            score += 20;
                            scoreDisplay.textContent = score;
                        } else {
                            feedback.textContent = "❌ Leider nicht ganz richtig. Geh zurück und versuche es erneut.";
                            feedback.className = "error";
                        }
                    }
                });
                poolContainer.appendChild(btn);
            });
        }

        function goHome() {
            exerciseScreen.classList.remove('active');
            menuScreen.classList.add('active');
        }

        init();
    </script>
</body>
</html>
